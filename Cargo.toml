[package]
name = "rs-markdown"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rmd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = "4.6.9"
crossterm = "0.29.0"
emojis = "0.9.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
mermaid-text = "0.58.0"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
resvg = { version = "0.50.0", default-features = false }
unicode-width = "0.2.3"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
